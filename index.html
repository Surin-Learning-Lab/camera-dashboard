<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #3b82f6;
    --good: #22c55e;
    --bad: #ef4444;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 32px 16px 64px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .cam-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .cam-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cam-name {
    font-weight: 600;
    font-size: 1rem;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.online { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .status-dot.offline { background: var(--bad); }
  .status-label {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
  }
  .feed-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }
  .feed-wrap.rotated {
    aspect-ratio: 3 / 4;
  }
  .feed-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .feed-wrap.rotated img {
    width: auto;
    height: 100%;
  }
  .feed-wrap.error::after {
    content: "Camera unreachable";
    position: absolute;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .feed-wrap.error img { display: none; }
  .quality-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.6);
    color: var(--text);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.03em;
    pointer-events: none;
  }
  .quality-badge.full { background: rgba(59,130,246,0.85); }
  .cam-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }
  .motion-label {
    font-size: 0.85rem;
    color: var(--muted);
  }
  button.toggle {
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: white;
  }
  button.toggle.off {
    background: #2d3138;
    color: var(--muted);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 40px;
  }
</style>
</head>
<body>

<h1>Camera Dashboard</h1>
<p class="subtitle">Live feeds &mdash; visible only to devices on the Tailscale network</p>

<div class="grid" id="camGrid"></div>
<ul><li>
  <a href="http://192.168.1.3:8090/">Cam 3</a>
</li>
<li>
  <a href="http://192.168.1.152:8090/">piCam</a>
</li></ul>
<footer>Streams load only if your device is connected to Tailscale.</footer>

<script>
// Add or remove cameras here — name, Tailscale HTTPS URL (no trailing slash), rotation in degrees (0, 90, 180, -90)
const cameras = [
  { name: "Camera 1 (piCam)", url: "https://picam.taila87d51.ts.net", rotation: -90 },
  { name: "Camera 2 (piCam2)", url: "https://picam2.taila87d51.ts.net", rotation: 90 },
  { name: "Camera 3 (test)", url: "https://test.taila87d51.ts.net", rotation: 90 },
  { name: "Camera 4 (piCam3)", url: "https://picam3.taila87d51.ts.net", rotation: 0 },
];

const grid = document.getElementById('camGrid');

cameras.forEach((cam, i) => {
  const rotated = Math.abs((cam.rotation || 0) % 180) === 90;
  const card = document.createElement('div');
  card.className = 'cam-card';
  card.innerHTML = `
    <div class="cam-header">
      <span class="cam-name">${cam.name}</span>
      <span class="status-label"><span class="status-dot" id="dot-${i}"></span><span id="status-${i}">checking</span></span>
    </div>
    <div class="feed-wrap ${rotated ? 'rotated' : ''}" id="feed-${i}" title="Tap to toggle full quality">
      <img src="${cam.url}/thumb.mjpg" id="img-${i}" style="transform: rotate(${cam.rotation || 0}deg);" />
      <span class="quality-badge" id="quality-${i}">THUMB</span>
    </div>
    <div class="cam-controls">
      <span class="motion-label" id="motion-label-${i}">Motion: unknown</span>
      <button class="toggle off" id="motion-btn-${i}">Turn On</button>
    </div>
  `;
  grid.appendChild(card);

  const img = document.getElementById(`img-${i}`);
  const feed = document.getElementById(`feed-${i}`);
  const dot = document.getElementById(`dot-${i}`);
  const status = document.getElementById(`status-${i}`);
  const motionLabel = document.getElementById(`motion-label-${i}`);
  const motionBtn = document.getElementById(`motion-btn-${i}`);
  const qualityBadge = document.getElementById(`quality-${i}`);

  let motionOn = false; // dashboard doesn't know the Pi's current state until you toggle from here
  let fullQuality = false;

  img.addEventListener('load', () => {
    feed.classList.remove('error');
    dot.className = 'status-dot online';
    status.textContent = 'online';
  });

  img.addEventListener('error', () => {
    feed.classList.add('error');
    dot.className = 'status-dot offline';
    status.textContent = 'offline';
  });

  feed.addEventListener('click', () => {
    fullQuality = !fullQuality;
    img.src = cam.url + (fullQuality ? '/stream.mjpg' : '/thumb.mjpg');
    qualityBadge.textContent = fullQuality ? 'FULL' : 'THUMB';
    qualityBadge.className = 'quality-badge' + (fullQuality ? ' full' : '');
  });

  function renderMotion() {
    motionLabel.textContent = 'Motion: ' + (motionOn ? 'ON' : 'OFF');
    motionBtn.textContent = motionOn ? 'Turn Off' : 'Turn On';
    motionBtn.className = 'toggle' + (motionOn ? '' : ' off');
  }

  motionBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // don't trigger the feed's quality-toggle click
    const endpoint = motionOn ? '/motion/off' : '/motion/on';
    fetch(cam.url + endpoint)
      .then(() => {
        motionOn = !motionOn;
        renderMotion();
      })
      .catch(() => {
        motionLabel.textContent = 'Motion: request failed';
      });
  });

  renderMotion();
});
</script>

</body>
</html>
